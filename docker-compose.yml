services:
  redis:
    image: redis:7-alpine
    container_name: cops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cops_network

  backend:
    container_name: cops_backend
    image: ${DOCKER_USERNAME}/cops-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SWAGGER_ENABLED=false
      - RUN_PRISMA_MIGRATIONS=${RUN_PRISMA_MIGRATIONS:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cops_network

volumes:
  redis_data:

networks:
  cops_network:
    driver: bridge
