name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ] # main 브랜치에 푸시될 때 실행
    paths:
      - 'backend/**' 
      - '.github/workflows/deploy-backend.yml'

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Prisma Client 생성
        run: npm run prisma:generate

      - name: 빌드 검증
        run: npm run build

      - name: 단위 테스트
        run: npm test -- --runInBand

      - name: E2E 스모크 테스트
        run: npm run test:e2e -- --runInBand

  build-and-push:
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend 
          file: ./backend/Dockerfile
          push: true
          # 태그: 본인DockerID/이미지명:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/cops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. EC2 배포 작업
  deploy:
    needs: build-and-push # 빌드가 성공해야 실행됨
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃 (docker-compose.yml 가져오기 위함)
        uses: actions/checkout@v4

      - name: docker-compose.yml 파일 EC2로 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USER }}/backend"

      - name: SSH로 서버 접속 및 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/backend

            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" >> .env
            echo "KAKAO_CALLBACK_URL=${{ secrets.KAKAO_CALLBACK_URL }}" >> .env
            echo "KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            echo "BACKEND_PORT=4000" >> .env
            echo "NODE_ENV=production" >> .env
            echo "HOST=0.0.0.0" >> .env
            echo "PORT=3000" >> .env
            echo "REDIS_HOST=redis" >> .env
            echo "REDIS_PORT=6379" >> .env
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" >> .env
            echo "SWAGGER_ENABLED=false" >> .env
            echo "RUN_PRISMA_MIGRATIONS=true" >> .env
          
            docker compose pull backend
            
            docker compose up -d --remove-orphans
            
            docker image prune -f
            
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:4000/health > /dev/null; then
                exit 0
              fi
              sleep 5
            done
            
            docker compose logs backend
            exit 1
